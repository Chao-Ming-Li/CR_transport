# Run: ./cr_solver model.cfg
# All parameters below are required. Comments start with #.
# Relative output paths are relative to the working directory, not this file.

# Isotopes: proton, network, or a comma-separated list such as O16,C12,B11.
mode = proton
source_weights = 1
# mode = network
# source_weights = 1,0,0.1,0,1,0,0,0,0,0
# mode = C12,B11
# source_weights = 1,0
steps = 1000
dt_yr = 10000
output_directory = output/cr_solver

# Uniform axisymmetric spatial grid; logarithmic rigidity grid.
nR = 100    # Number of radial grid points
nz = 100   # Number of vertical grid points
nRg = 50  # Number of rigidity grid points
R_max_kpc = 100 # Maximum radial extent of the grid in kpc
z_max_kpc = 100 # Maximum vertical extent of the grid in kpc
Rg_min_GV = 1e1  # Minimum rigidity of the CRs in GV
Rg_max_GV = 1e6  # Maximum rigidity of the CRs in GV

# Dxx = D0 * (Rg/GV)^delta. D0 is defined at 1 GV.
D0_cm2_per_s = 3.0171515377970484e+28 # Diffusion coefficient at 1 GV in cm^2/s
delta = 0.3333333333333333 # Diffusion coefficient rigidity index
vA_km_per_s = 30 # Alfven speed in km/s
nH_cm3 = 1 # Hydrogen number density in cm^-3
helium_enhancement = 1 # Multiplier of all nuclear collision rates relative to hydrogen targets
wind_km_per_s = 100 # Wind speed in km/s

# Source: exp(-(R-R0)^2/width^2 -(z-z0)^2/width^2) * (Rg/GV)^(-index).
# width is the Gaussian e-folding width, not its standard deviation.
source_rate = 1e-8
source_R_kpc = 10
source_z_kpc = 10
source_width_kpc = 3
source_index = 2
